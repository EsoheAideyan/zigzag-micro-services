services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zigzag
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres    

  ### ➡️ Add MinIO (Storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin     # Username (change if needed)
      MINIO_ROOT_PASSWORD: minioadmin # Password (change if needed)
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./zigzagmicroservices/user-service
    container_name: user_service
    ports:
      - "3030:3030"
    environment:
      - DOCKER=true
      - DB_HOST_DOCKER=postgres
      - DB_HOST_LOCAL=localhost
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=zigzag
      - JWT_SECRET_ACCESS_TOKEN=zigzag
      - JWT_SECRET_REFRESH_TOKEN=zigzag
    depends_on:
      - postgres

  event-service:
    build: ./zigzagmicroservices/events-service
    container_name: events_service
    ports:
      - "3031:3031"
    environment:
      - DOCKER=true
      - DB_HOST_DOCKER=postgres
      - DB_HOST_LOCAL=localhost
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=zigzag
    depends_on:
      - postgres

  media-service:
    build: ./zigzagmicroservices/media-service
    container_name: media_service
    ports:
      - "3032:3032"
    environment:
      - DOCKER=true
      - DB_HOST_DOCKER=postgres
      - DB_HOST_LOCAL=localhost
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=zigzag
      - MINIO_PUBLIC_URL=http://localhost:3000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=media-bucket
    depends_on:
      minio:
        condition: service_healthy   

  api-gateway:
    build: ./zigzagmicroservices/api-gateway
    container_name: api_gateway
    ports:
      - "3000:3000"
    environment:
      - DOCKER=true
      - USER_SERVICE_URL=http://user-service:3030
      - EVENT_SERVICE_URL=http://event-service:3031
      - MEDIA_SERVICE_URL=http://media-service:3032
    depends_on:
      - user-service
      - event-service
      - media-service

volumes:   # <-- move this to root level
  pgdata:
  minio_data: